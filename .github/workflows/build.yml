name: Build Windows exe

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pyinstaller
      - run: pyinstaller --onefile --noconsole --name PrintFit printfit.py
      - uses: actions/upload-artifact@v4
        with:
          name: PrintFit-windows
          path: dist/PrintFit.exe
